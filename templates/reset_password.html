<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Transmute</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reset_password.css') }}"
    />
  </head>
  <body>
    <span class="tx-rune tl">AU·79<br />TRANSMUTE</span>
    <span class="tx-rune tr">PWD·RST<br />REFORGE</span>
    <span class="tx-rune bl">v2.1.0<br />SECURE</span>
    <span class="tx-rune br">KEY·NEW<br />ACTIVE</span>

    <div class="tx-card">
      <div class="tx-inner">
        <div class="tx-wordmark">Trans<em>m</em>ute</div>
        <div class="tx-tagline">// credential.reforge → set_new_password</div>
        <div class="tx-divider"></div>

        <div class="tx-icon">
          <div class="tx-icon-ring">
            <!-- Lock / key icon -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="11" width="14" height="10" rx="2" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              <circle cx="12" cy="16" r="1" fill="currentColor" stroke="none" />
            </svg>
          </div>
        </div>

        <div id="auth-response"></div>

        <form id="reset-form">
          <!-- OTP -->
          <div id="otp-field" class="tx-field">
            <label class="tx-label">6-Digit OTP</label>
            <input
              class="tx-input"
              name="otp"
              id="otp-input"
              type="text"
              maxlength="6"
              inputmode="numeric"
              pattern="[0-9]{6}"
              placeholder="000000"
            />
          </div>

          <!-- Hidden token — populated by JS -->
          <input type="hidden" name="token" id="token-input" />

          <div class="tx-section-sep">
            <div class="tx-section-sep-line"></div>
            <span class="tx-section-sep-label">new credentials</span>
            <div class="tx-section-sep-line"></div>
          </div>

          <div class="tx-field">
            <label class="tx-label">New Password</label>
            <input
              class="tx-input"
              name="new_password"
              id="new-password"
              type="password"
              placeholder="••••••••••••"
              required
            />
            <div class="tx-strength">
              <div class="tx-strength-fill" id="strength-fill"></div>
            </div>
          </div>

          <div class="tx-field">
            <label class="tx-label">Confirm New Password</label>
            <input
              class="tx-input"
              name="confirm_password"
              id="confirm-new-password"
              type="password"
              placeholder="••••••••••••"
              required
            />
          </div>

          <button type="submit" class="tx-submit" id="reset-btn">
            <span id="reset-btn-text">Reset Password</span>
          </button>
        </form>

        <div class="tx-footer">
          <div class="tx-footer-line"></div>
          <a href="{{ url_for('Templates.login') }}" class="tx-link"
            >← sign in</a
          >
          <span class="tx-link-sep">·</span>
          <a href="{{ url_for('Templates.forgot_password') }}" class="tx-link"
            >resend link</a
          >
          <div class="tx-footer-line"></div>
        </div>
      </div>
    </div>

    <script>
      window.APP_CONFIG = {
        loginUrl: "{{ url_for('Templates.index') }}",
        forgotPasswordUrl: "{{ url_for('Templates.forgot_password') }}",
        downloadUrl: "{{ url_for('Templates.download') }}",
        homeUrl: "{{ url_for('Templates.index') }}",
      };

      const pwInput = document.getElementById("new-password");
      const fill = document.getElementById("strength-fill");
      if (pwInput && fill) {
        pwInput.addEventListener("input", () => {
          const v = pwInput.value;
          let score = 0;
          if (v.length >= 8) score += 25;
          if (v.length >= 12) score += 15;
          if (/[A-Z]/.test(v)) score += 20;
          if (/[0-9]/.test(v)) score += 20;
          if (/[^A-Za-z0-9]/.test(v)) score += 20;
          fill.style.width = Math.min(score, 100) + "%";
          fill.style.background =
            score < 40 ? "#c94c4c" : score < 70 ? "#c9a84c" : "#4caf7d";
        });
      }
    </script>
    <script
      type="module"
      src="{{ url_for('static', filename='js/reset_password.js') }}"
    ></script>
  </body>
</html>
