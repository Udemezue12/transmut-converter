<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Transmute</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/forgot_password.css') }}"
    />
  
</head>
<body>

  <span class="tx-rune tl">AU·79<br>TRANSMUTE</span>
  <span class="tx-rune tr">Hg·80<br>INITIATE</span>
  <span class="tx-rune bl">v2.1.0<br>SECURE</span>
  <span class="tx-rune br">KEY·RST<br>ACTIVE</span>

  <div class="tx-card">
    <div class="tx-inner">

      <div class="tx-wordmark">Trans<em>m</em>ute</div>
      <div class="tx-tagline">// identity.recovery → send_reset_link</div>
      <div class="tx-divider"></div>

      <div class="tx-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="3" fill="#c9a84c"/>
          <ellipse cx="18" cy="18" rx="16" ry="6" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.6"/>
          <ellipse cx="18" cy="18" rx="16" ry="6" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.6" transform="rotate(60 18 18)"/>
          <ellipse cx="18" cy="18" rx="16" ry="6" stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.6" transform="rotate(120 18 18)"/>
        </svg>
      </div>

      <div id="auth-response"></div>

      <form id="forgot-form">
        <div class="tx-field">
          <label class="tx-label" for="email">Email Address</label>
          <input
            class="tx-input"
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <button type="submit" class="tx-submit" id="forgot-btn">
          <span id="forgot-btn-text">Send Reset Link</span>
        </button>
      </form>

      <div class="tx-footer">
        <div class="tx-footer-line"></div>
        <a href="{{ url_for('Templates.login') }}" class="tx-link">← back to sign in</a>
        <div class="tx-footer-line"></div>
      </div>

    </div>
  </div>

  <script>
    window.APP_CONFIG = {
      loginUrl:    "{{ url_for('Templates.login') }}",
      downloadUrl: "{{ url_for('Templates.download') }}",
      homeUrl:     "{{ url_for('Templates.index') }}",
    };
  </script>
  <script type="module" src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
</body>
</html>
